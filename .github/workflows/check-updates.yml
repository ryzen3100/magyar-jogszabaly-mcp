name: Daily Data Freshness Check

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check_updates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download current database artifact
        run: bash scripts/download-db.sh

      - name: Check upstream freshness
        id: check
        shell: bash
        run: |
          set +e
          go build -o checker ./cmd/check-updates
          if [ $? -ne 0 ]; then
            echo "check-updates binary failed to build" | tee check-updates.log
            STATUS=2
          else
            ./checker 2>&1 | tee check-updates.log
            STATUS=${PIPESTATUS[0]}
          fi
          echo "status_code=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -eq 1 ]; then
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
            echo "check_error=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -eq 0 ]; then
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
            echo "check_error=false" >> "$GITHUB_OUTPUT"
          else
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
            echo "check_error=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-updates-log
          path: check-updates.log
          retention-days: 14

      - name: Create or update issue when updates found
        if: steps.check.outputs.updates_found == 'true' || steps.check.outputs.check_error == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const updatesFound = '${{ steps.check.outputs.updates_found }}' === 'true';
            const checkError = '${{ steps.check.outputs.check_error }}' === 'true';

            const title = checkError
              ? 'Data Freshness: Check errors detected'
              : 'Data Freshness: Updates available from upstream source';

            const body = [
              `**Automated freshness check:** ${new Date().toISOString()}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Updates found | ${updatesFound} |`,
              `| Check errors | ${checkError} |`,
              `| Exit code | ${{ steps.check.outputs.status_code }} |`,
              '',
              '### Recommended actions',
              '1. Run `go run ./cmd/check-updates` locally for details',
              '2. If updates available, run ingestion and rebuild database',
              '3. Re-run tests before release',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-update',
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-update', 'automated'],
              });
            }

      - name: Close stale issues when clean
        if: steps.check.outputs.updates_found == 'false' && steps.check.outputs.check_error == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-update',
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
