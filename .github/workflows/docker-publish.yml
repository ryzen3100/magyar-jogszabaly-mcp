name: Publish Docker image

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ryzen3100/magyar-jogszabaly-mcp

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: magyar-jogszabaly-mcp:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,mode=max,scope=docker-image

      - name: Start and verify container
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name magyar-jogszabaly-mcp-smoke \
            --publish 127.0.0.1:18080:3000 \
            magyar-jogszabaly-mcp:smoke

          cleanup() {
            docker logs magyar-jogszabaly-mcp-smoke || true
            docker rm --force magyar-jogszabaly-mcp-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo 'Container did not become healthy in time.' >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:18080/mcp | grep -q 'streamable-http'
          python3 scripts/http-smoke.py http://127.0.0.1:18080

          # Validate the bundled database actually shipped in the image
          # (replaces the former in-container node/sqlite check — the Go image
          # has no node; pull the DB out and inspect it with the runner's
          # python3 sqlite3 stdlib instead).
          docker cp magyar-jogszabaly-mcp-smoke:/data/database.db /tmp/smoke-database.db
          python3 - <<'PY'
          import sqlite3

          con = sqlite3.connect("file:/tmp/smoke-database.db?mode=ro", uri=True)
          documents = con.execute("SELECT COUNT(*) FROM legal_documents").fetchone()[0]
          provisions = con.execute("SELECT COUNT(*) FROM legal_provisions").fetchone()[0]
          hit = con.execute("SELECT rowid FROM provisions_fts LIMIT 1").fetchone()
          if documents < 1 or provisions < 1 or hit is None:
              raise SystemExit("Smoke database/search validation failed")
          print(f"Smoke database OK: {documents} documents, {provisions} provisions")
          PY

      - name: Retag and push verified image
        env:
          IMAGE: magyar-jogszabaly-mcp:smoke
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
