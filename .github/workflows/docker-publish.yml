name: Publish Docker image

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ryzen3100/magyar-jogszabaly-mcp

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: magyar-jogszabaly-mcp:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,mode=max,scope=docker-image

      - name: Start and verify container
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name magyar-jogszabaly-mcp-smoke \
            --publish 127.0.0.1:18080:3000 \
            magyar-jogszabaly-mcp:smoke

          cleanup() {
            docker logs magyar-jogszabaly-mcp-smoke || true
            docker rm --force magyar-jogszabaly-mcp-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo 'Container did not become healthy in time.' >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:18080/mcp | grep -q 'streamable-http'
          python3 scripts/http-smoke.py http://127.0.0.1:18080

          docker exec magyar-jogszabaly-mcp-smoke node --input-type=module -e "import Database from '@ansvar/mcp-sqlite'; const db = new Database('/data/database.db', { readonly: true }); const documents = Number(db.prepare('SELECT COUNT(*) AS count FROM legal_documents').get().count); const provisions = Number(db.prepare('SELECT COUNT(*) AS count FROM legal_provisions').get().count); const hit = db.prepare('SELECT rowid FROM provisions_fts LIMIT 1').get(); if (documents < 1 || provisions < 1 || !hit) throw new Error('Smoke database/search validation failed'); db.close();"

      - name: Retag and push verified image
        env:
          IMAGE: magyar-jogszabaly-mcp:smoke
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
