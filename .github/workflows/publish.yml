name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Build
        run: go build ./...

      # Release artifacts: the Docker image (the distributed artifact since the
      # Go port) is built, smoke-tested, and pushed to GHCR by
      # docker-publish.yml on the same v* tags. Standalone binaries would
      # attach here if ever needed — deliberately no extra release tooling.
