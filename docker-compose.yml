services:
  magyar-jogszabaly-mcp:
    image: ghcr.io/ryzen3100/magyar-jogszabaly-mcp:latest
    pull_policy: always
    container_name: magyar-jogszabaly-mcp
    restart: unless-stopped
    ports:
      # Keep this port on the LAN; do not configure router port forwarding.
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Optional OAuth for clients that require it:
      # OAUTH_ENABLED: "true"
      # BASE_URL: "http://openmediavault.local:3000"
      HUNGARIAN_LAW_DB_PATH: "/data/database.db"
    volumes:
      - law-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  law-data:
