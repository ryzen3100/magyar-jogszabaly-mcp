services:
  magyar-jogszabaly-mcp:
    image: ghcr.io/ryzen3100/magyar-jogszabaly-mcp:latest
    pull_policy: always
    container_name: magyar-jogszabaly-mcp
    restart: unless-stopped
    ports:
      # Keep this port on the LAN; do not configure router port forwarding.
      - "3000:3000"
    environment:
      # HOST=0.0.0.0 is required inside the container: the server defaults to
      # loopback (it has no in-process auth), which docker-proxy could never
      # reach. Exposure stays bounded by the ports mapping above.
      HOST: "0.0.0.0"
      PORT: "3000"
      HUNGARIAN_LAW_DB_PATH: "/data/database.db"
    volumes:
      - law-data:/data

volumes:
  law-data:
